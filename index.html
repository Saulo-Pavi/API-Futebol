<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Explorador de Clubes - Open Football</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <header>
            <h1>⚽ Explorador de Clubes de Futebol</h1>
            <p>Consulte ligas e times de todo o mundo via Open Football API</p>
        </header>

        <div class="search-container">
            <input type="text" id="searchInput" placeholder="Digite o nome do time..." onkeypress="if(event.key === 'Enter') buscarTimesComFiltro()">
            <button onclick="buscarTimesComFiltro()">Pesquisar</button>
            <button class="btn-secondary" onclick="carregarListaPadraoSemFiltro()">Ver Padrão</button>
        </div>

        <div class="action-bar">
            <button class="btn-logs" onclick="abrirModalLogs()">📋 Ver Logs de Consumo da API</button>
        </div>

        <div id="statusMessage" class="status-msg">Carregando dados da API...</div>

        <div id="teamsGrid" class="grid"></div>
    </div>

    <!-- Modal de Detalhes do Time -->
    <div id="detailModal" class="modal-overlay">
        <div class="modal-content">
            <button class="close-btn" onclick="fecharModal()">&times;</button>
            <div id="modalBody"></div>
        </div>
    </div>

    <!-- Modal de Logs de Consumo -->
    <div id="logsModal" class="modal-overlay">
        <div class="modal-content modal-content-large">
            <button class="close-btn" onclick="fecharModalLogs()">&times;</button>
            <h2 style="color: var(--primary); margin-bottom: 10px;">📋 Registro de Logs de Consumo (Piway)</h2>
            <div id="logsStatus" style="margin-bottom: 15px; color: #475569;"></div>

            <div class="table-container">
                <table class="logs-table">
                    <thead>
                        <tr>
                            <th>ID Log</th>
                            <th>Método/Ação</th>
                            <th>Resultado</th>
                            <th class="center-text">Ações</th>
                        </tr>
                    </thead>
                    <tbody id="logsTableBody"></tbody>
                </table>
            </div>
        </div>
    </div>

    <footer>
        <p>Desenvolvido por <strong>Saulo Pavi</strong></p>
        <p>Disciplina: Fundamentos ao Desenvolvimento Web - Unoesc</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
