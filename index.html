<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Explorador de Clubes - Open Football</title>
    <style>
        :root {
            --primary: #1e3a8a;
            --accent: #2563eb;
            --bg: #f8fafc;
            --card-bg: #ffffff;
            --text: #1e293b;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: var(--bg); color: var(--text); padding: 20px; display: flex; flex-direction: column; min-height: 100vh; }
        
        .container { max-width: 1100px; margin: 0 auto; width: 100%; flex: 1; }
        
        header { text-align: center; margin-bottom: 30px; }
        header h1 { color: var(--primary); font-size: 2rem; margin-bottom: 8px; }
        
        /* Área de Filtro */
        .search-container { display: flex; gap: 10px; max-width: 600px; margin: 0 auto 30px auto; }
        input[type="text"] { flex: 1; padding: 12px 16px; font-size: 1rem; border: 1px solid #cbd5e1; border-radius: 8px; outline: none; }
        input[type="text"]:focus { border-color: var(--accent); }
        button { padding: 12px 24px; background-color: var(--accent); color: white; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; transition: background 0.2s; }
        button:hover { background-color: var(--primary); }

        /* Status & Alertas */
        .status-msg { text-align: center; font-size: 1.1rem; color: #64748b; margin: 20px 0; }

        /* Grid Responsiva (Dados com repetição) */
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 20px; }
        
        .card { background: var(--card-bg); border-radius: 12px; padding: 20px; text-align: center; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); cursor: pointer; transition: transform 0.2s, box-shadow 0.2s; }
        .card:hover { transform: translateY(-5px); box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1); }
        .card img { max-width: 100px; height: 100px; object-fit: contain; margin-bottom: 15px; }
        .card h3 { font-size: 1.1rem; color: var(--primary); margin-bottom: 5px; }
        .card p { font-size: 0.9rem; color: #64748b; }

        /* Modal para Exibição de Dados SEM Repetição (Detalhes Únicos) */
        .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); justify-content: center; align-items: center; z-index: 1000; padding: 20px; }
        .modal-content { background: white; max-width: 650px; width: 100%; max-height: 90vh; overflow-y: auto; border-radius: 12px; padding: 25px; position: relative; }
        .close-btn { position: absolute; top: 15px; right: 15px; font-size: 1.5rem; border: none; background: none; cursor: pointer; color: #64748b; }
        
        .team-detail-header { display: flex; align-items: center; gap: 20px; margin-bottom: 20px; }
        .team-detail-header img { width: 90px; height: 90px; object-fit: contain; }
        .bio-text { font-size: 0.95rem; line-height: 1.5; color: #334155; margin-top: 10px; max-height: 150px; overflow-y: auto; background: #f1f5f9; padding: 10px; border-radius: 6px; }

        /* Rodapé Obrigatório */
        footer { margin-top: 40px; border-top: 1px solid #e2e8f0; padding-top: 20px; text-align: center; font-size: 0.9rem; color: #64748b; }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>⚽ Explorador de Clubes de Futebol</h1>
            <p>Consulte ligas e times de todo o mundo via Open Football API</p>
        </header>

        <!-- Chamada COM filtro -->
        <div class="search-container">
            <input type="text" id="searchInput" placeholder="Digite o nome do time (ex: Arsenal, Real Madrid)..." onkeypress="if(event.key === 'Enter') buscarTimesComFiltro()">
            <button onclick="buscarTimesComFiltro()">Pesquisar</button>
            <button onclick="carregarListaPadraoSemFiltro()" style="background-color: #64748b;">Ver Padrão</button>
        </div>

        <div id="statusMessage" class="status-msg">Carregando dados da API...</div>

        <!-- Renderização de Dados COM Repetição -->
        <div id="teamsGrid" class="grid"></div>
    </div>

    <!-- Modal de Exibição de Dados SEM Repetição (Detalhes) -->
    <div id="detailModal" class="modal-overlay">
        <div class="modal-content">
            <button class="close-btn" onclick="fecharModal()">&times;</button>
            <div id="modalBody"></div>
        </div>
    </div>

    <!-- Rodapé exigido pelo professor Rafaeli Pinheiro -->
    <footer>
        <p>Desenvolvido por <strong>Saulo Araujo Pavi</strong></p>
        <p>Disciplina: Fundamentos ao Desenvolvimento Web - Unoesc</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
